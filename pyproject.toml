[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ensys.wrapper"
version = "0.3.0"
dependencies = [
    'pydantic>=2.0',
    'oemof.solph==0.6.3',
    'pyrsistent'
]
authors=[
    {name = "Andreas Lubojanski", email = "andreas.lubojanski@hs-nordhausen.de"}
]
description = "ensys-wrapper is a wrapper to map oemof.solph classes to abstract configcontainers for with type verification."
readme = "README.md"
requires-python = ">=3.9"
classifiers=[
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]


[project.urls]
Homepage = "https://github.com/in-RET/ensys-solph-wrapper"
Issues = "https://github.com/in-RET/ensys-solph-wrapper/issues"

[tool.setuptools]
package-dir = {"" = "src"}